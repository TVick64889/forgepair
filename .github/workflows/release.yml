name: PyPI Release

# Publishes to PyPI via Trusted Publishing (OIDC) -- no long-lived
# PYPI_API_TOKEN secret to store, rotate, or leak. PyPI authenticates
# this workflow run directly by its GitHub identity (repo + workflow
# file name), verified against the pending publisher registered at
# https://pypi.org/manage/account/publishing/ for the `forgepair`
# project (owner forgepair, repo forgepair, workflow release.yml).
# NOTE: the repo transferred from the personal TVick64889 account to
# the forgepair org on 2026-09-10, AFTER the v1.0.0 release that used
# this workflow succeeded under the old owner. PyPI's Trusted Publisher
# config binds to the exact GitHub owner/repo/workflow identity -- if
# it wasn't updated to owner=forgepair after the transfer, the next
# publish will fail with an OIDC identity mismatch. Verify at
# https://pypi.org/manage/project/forgepair/settings/publishing/
# before relying on the next merge to auto-publish.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
