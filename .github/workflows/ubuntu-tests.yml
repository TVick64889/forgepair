name: Ubuntu Python Tests

# Runs on every push/PR against main -- no paths-ignore filter. This is
# deliberate: branch protection requires this check to pass before
# merge, and a required check that's skipped by a path filter can never
# report success, which permanently blocks any PR that only touches
# excluded paths (e.g. README.md). Confirmed this failure mode directly
# (see CHANGES.md) before removing the filter that used to be here.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libportaudio2

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install .

    - name: Run tests
      env:
        AIDER_ANALYTICS: false
      run: |
        pytest
