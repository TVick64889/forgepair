name: Windows Python Tests

# Runs on every push/PR against main -- no paths-ignore filter, same
# reasoning as ubuntu-tests.yml (a required branch-protection check that
# a path filter can skip permanently blocks matching PRs -- confirmed
# directly, see CHANGES.md).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group: # required so this check can report on merge-queue validation runs

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install .

    - name: Run tests
      env:
        AIDER_ANALYTICS: false
      run: |
        pytest
        
